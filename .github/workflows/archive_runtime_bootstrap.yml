name: Archive Theater Runtime Bootstrap

on:
  push:
    branches:
      - archive-theater-runtime-bootstrap
  pull_request:
    branches:
      - main
      - master

jobs:
  runtime-wheels:
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Download exact runtime wheels
        run: |
          python -m pip install --upgrade pip
          mkdir -p runtime_wheels
          python -m pip download --only-binary=:all: --dest runtime_wheels \
            panda3d==1.10.16 \
            pygame-ce==2.5.7
          python - <<'PY'
          from pathlib import Path
          import hashlib
          lines = []
          for path in sorted(Path('runtime_wheels').glob('*')):
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f'{digest}  {path.name}')
          Path('runtime_wheels/SHA256SUMS.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print('\n'.join(lines))
          PY

      - name: Upload runtime wheel bundle
        uses: actions/upload-artifact@v4
        with:
          name: gx-archive-theater-runtime-py313-linux
          path: runtime_wheels/
          if-no-files-found: error
          retention-days: 1
